# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# Markdown here is documentation with ONE exception, and the exception is the
# trap the lanes README warns every consumer about: README.md carries the
# consumer-facing YAML examples, and readme.test.js extracts every ```yaml
# fenced block from it and asserts each one parses. That makes an edit to
# README.md an edit to a test fixture — a docs-only skip on it would let a
# malformed example merge green, and break the next code pull request on
# prose it never touched. So README.md is code, exactly as it is in
# mikelward/lanes' own policy, and for the same reason.
#
# Nothing else is read: AGENTS.md and TODO.md are prose no test asserts
# against, so they stay documentation. Everything that is not markdown is
# code, including the workflows (commit-artifact.yml is what every consumer
# runs), the test files, and .gitignore.
code README.md
docs **/*.md

# The one subject prefix the docs lane accepts. The wider housekeeping table
# in AGENTS.md (test:, build:, refactor:) names categories this lane can never
# actually admit: every file it accepts is markdown, so a commit that really
# was test, build, or refactor work would carry a non-markdown file and ride
# the code lane instead. Accepting those three would have the required gate
# blessing subjects that describe work the diff cannot contain.
prefixes docs

# ci.yml declares no workflow_dispatch trigger, so no dispatched run is
# legitimate here: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
