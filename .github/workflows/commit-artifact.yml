name: commit-artifact

# The reusable half of the "commit rendered output back to a PR branch"
# pattern — see README.md for what this is and AGENTS.md for why it's
# structured as a separate clean job rather than a hardened one.
#
# Call this as a job (`uses:`, not a step) from a job that `needs:` the one
# that renders and uploads the artifact. Jobs inside a called reusable
# workflow share the calling workflow's run, so `download-artifact` here can
# see an artifact an earlier job in the CALLER uploaded — no need to pass the
# rendered content through `inputs` (which only accepts strings/numbers/
# booleans, not files).

on:
  workflow_call:
    inputs:
      artifact-name:
        description: >-
          Name of the workflow artifact — uploaded by an earlier job in the
          calling workflow via actions/upload-artifact — to commit. Must
          exist: this job fails if it can't be downloaded, rather than
          silently skipping. actions/upload-artifact can't represent a
          genuinely empty render as a real artifact, so if yours can
          legitimately produce zero files, upload a placeholder for that
          case instead of relying on if-no-files-found: ignore.
        required: true
        type: string
      dest-path:
        description: >-
          Path, relative to the repo root, that the artifact's contents
          replace. Anything already committed under this path that the
          artifact doesn't recreate is removed (git add -A on this path).
        required: true
        type: string
      commit-message:
        description: Commit subject for the regenerated content.
        required: true
        type: string
      branch-ref:
        description: >-
          Branch to check out and push to — normally
          github.event.pull_request.head.ref. Same-repo PRs only: this
          workflow always checks out and pushes to the CALLER's own
          repository, authenticated with the caller's GITHUB_TOKEN. Gate the
          calling job on github.event.pull_request.head.repo.full_name ==
          github.repository before invoking it for a fork PR — the branch
          won't exist here at all (checkout fails loudly), UNLESS the base
          repo happens to have a same-named branch, in which case this would
          silently check out and commit to the wrong branch instead.
        required: true
        type: string
      expected-head-sha:
        description: >-
          The commit the artifact was rendered against — normally
          github.event.pull_request.head.sha, captured by the caller at
          trigger time. If branch-ref has since moved past this, the commit
          is skipped: cancel-in-progress is asynchronous, so a push between
          when the render job started and this job running doesn't stop the
          render job first, it just moves the branch tip out from under it.
          Committing the old render onto the new tip would be silently
          wrong, not merely stale — the run the newer push triggers renders
          and commits for real.
        required: true
        type: string
      pr-number:
        description: >-
          Pull request number. Required only if dispatch-workflow or
          comment-marker is set; pass '' otherwise.
        required: false
        type: string
        default: ''
      dispatch-workflow:
        description: >-
          Workflow file to dispatch on branch-ref after a successful push
          (e.g. ci.yml), so the caller's required checks report on the new
          commit — a GITHUB_TOKEN-authored push starts no workflow run on
          its own. Needs a `workflow_dispatch` trigger with a `pr` input on
          the CALLER's default branch (GitHub can't dispatch a workflow file
          it can't see there, however branch-ref itself spells it). Leave
          '' to skip dispatching.
        required: false
        type: string
        default: ''
      comment-marker:
        description: >-
          HTML comment marker (e.g. '<!-- my-artifact-status -->') for a
          sticky, upserted PR comment reporting whether this run committed
          anything. Leave '' to skip posting one.
        required: false
        type: string
        default: ''
      artifact-noun:
        description: >-
          Human-readable plural noun for what the artifact holds, used only
          in the freshness comment (e.g. "UI snapshot"). Ignored if
          comment-marker is ''.
        required: false
        type: string
        default: 'file'
    secrets:
      push-token:
        description: >-
          A fine-grained PAT (Contents: read and write, scoped to this
          repository only) used to push the commit instead of the job's own
          GITHUB_TOKEN. A GITHUB_TOKEN-authored push starts no workflow run
          on its own, which is why dispatch-workflow exists — but dispatching
          onto branch-ref is safe ONLY when the CALLING workflow's own
          trigger (github.event_name, read directly below rather than taken
          as a caller-supplied input — a caller declaring the wrong one
          would silently defeat this whole check) is 'pull_request': there,
          the workflow file that actually runs is already the PR branch's
          own copy, so a dispatch onto that same branch grants it no new
          trust. It is NOT safe when the caller's trigger is
          'pull_request_target': that trigger always reads the workflow
          DEFINITION from the repository's default branch regardless of
          which ref runs, so a workflow_dispatch onto the PR's own branch
          would instead execute THAT branch's — potentially PR-controlled —
          copy of the workflow, with whatever elevated permissions the
          calling workflow's own actions:write grant holds. This secret is
          how pull_request_target callers get a safe retrigger instead: an
          authenticated PAT push looks like an ordinary push and retriggers
          the caller's own pull_request_target trigger directly, no dispatch
          needed. Required when the caller is pull_request_target-triggered
          and dispatch-workflow is set; the validation step below refuses
          that combination without it rather than silently falling back to
          an unsafe dispatch.
        required: false
    outputs:
      committed:
        description: >-
          'true' if a commit was pushed, 'false' if there was nothing to
          commit or branch-ref had moved past expected-head-sha.
        value: ${{ jobs.commit.outputs.committed }}
      commit-sha:
        description: >-
          The resulting head of branch-ref: the new commit if one was
          pushed, otherwise its unchanged current head.
        value: ${{ jobs.commit.outputs.commit_sha }}

jobs:
  commit:
    runs-on: ubuntu-latest
    # Declared explicitly as a ceiling, not left to inherit whatever the
    # caller's own workflow-level grant happens to be — a reusable
    # workflow's job permissions are honored but capped by the caller, never
    # widened past it, so this is the actual limit this job runs under.
    permissions:
      contents: write # push the commit
      pull-requests: write # freshness comment
      actions: write # download-artifact read + workflow dispatch
    outputs:
      # Falls back to 'false' when the commit step was skipped entirely (a
      # moved branch, or a failed/missing download) — steps.commit.outputs.committed
      # is unset in that case, and the documented contract promises 'false'
      # there, not an empty string a caller's == 'false' check would miss.
      committed: ${{ steps.commit.outputs.committed || 'false' }}
      commit_sha: ${{ steps.commit.outputs.commit_sha || steps.guard.outputs.actual_head_sha }}
    steps:
      - name: Validate the input combination
        id: validate
        # Fails fast, before checkout or any real work. Runs unconditionally
        # — unlike the pr-number checks below (only relevant when a caller
        # sets one of the optional inputs that needs it), expected-head-sha
        # is always required and always worth checking, so this step can't
        # skip itself the way it used to.
        #
        # expected-head-sha must look like a real SHA. A caller typically
        # supplies github.event.pull_request.head.sha — a context field
        # that's EMPTY on an event where pull_request doesn't exist (a
        # workflow_dispatch, say), and `required: true` on a workflow_call
        # input only checks the caller supplied the KEY, not that its value
        # is non-empty or well-formed. Without this check, an empty or
        # malformed value would compare unequal to guard's real
        # actual_head_sha unconditionally, and the mismatch branch reads
        # that as "branch-ref advanced, skip" — a caller CONFIGURATION
        # error silently absorbed as the ordinary, expected race this
        # workflow already handles, rather than surfaced as the bug it is.
        # GitHub's git backend is SHA-1 today (40 lowercase hex chars); this
        # doesn't attempt to anticipate a future SHA-256 migration.
        #
        # branch-ref needs the same treatment, for the same underlying
        # reason and a distinct downstream failure mode: actions/checkout
        # treats an empty `ref:` as unset and silently falls back to the
        # triggering event's own ref (on a pull_request run, typically the
        # synthetic merge commit) rather than failing. The checkout below
        # would then succeed against the WRONG commit, and the guard step's
        # mismatch against expected-head-sha would read as the same ordinary
        # "branch-ref advanced" race — leaving the run green with
        # committed: false instead of surfacing the caller's empty
        # expression.
        #
        # Two independent things can be wrong with pr-number, checked
        # separately so the error names the actual mistake:
        #   - it's '' while comment-marker's freshness comment or
        #     dispatch-workflow's `-f pr="$PR_NUMBER"` needs a real one —
        #     both silently no-op or pass an empty string otherwise, which a
        #     caller would only discover as a quiet failure (missing
        #     comment, or a dispatch call carrying no PR).
        #   - it's non-empty but not actually a PR number (e.g. a typo'd
        #     'true', a stray quote). Number('abc') is NaN, and every
        #     downstream use of it (github.rest.pulls.get, gh workflow run
        #     -f pr=) fails or misbehaves far from here — the freshness
        #     comment's own API errors are caught and swallowed into a
        #     silent skip (continue-on-error, by design, for genuine API
        #     hiccups), which would hide a caller misconfiguration behind
        #     the same "no comment posted" symptom as a transient failure.
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BRANCH_REF: ${{ inputs.branch-ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          DISPATCH_WORKFLOW: ${{ inputs.dispatch-workflow }}
          # Read directly from the run's own github context, NOT taken as a
          # caller-supplied input (Codex review, PR #1): a reusable workflow
          # shares the calling workflow's github context for the whole run
          # (the same fact that lets download-artifact below see an
          # artifact a job in the CALLER uploaded), so this is ground truth
          # about what actually triggered the run, not a claim a caller
          # could get wrong -- honestly or otherwise -- the way a
          # caller-declared string input could. A wrong caller-declared
          # value would have silently defeated the whole check just below.
          EVENT_NAME: ${{ github.event_name }}
          # Not itself spliced anywhere below or logged — only ever tested
          # for emptiness, via a bare shell string comparison rather than a
          # command whose argv or output could land in the run log.
          HAS_PUSH_TOKEN: ${{ secrets.push-token != '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ] && [ -n "$DISPATCH_WORKFLOW" ] && [ "$HAS_PUSH_TOKEN" != "true" ]; then
            echo "::error::this run was triggered by pull_request_target and dispatch-workflow is set, but no push-token secret was given. Dispatching onto branch-ref under pull_request_target would run that branch's own (potentially PR-controlled) copy of the workflow file with dispatch-workflow's elevated permissions -- pass a push-token secret (see its description) instead of relying on dispatch-workflow here."
            exit 1
          fi
          # actions/download-artifact reads `!!inputs.name` to decide whether
          # this is a single-artifact download — an empty string is exactly
          # as falsy as an omitted input, so it falls into the "download
          # every artifact" path instead of failing on a name that doesn't
          # exist. Verified against the action's own source
          # (actions/download-artifact, download-artifact.ts) before fixing.
          if [ -z "$ARTIFACT_NAME" ]; then
            echo "::error::artifact-name is '' — download-artifact would silently download every artifact in the run instead of failing on a missing one. Check the caller's expression."
            exit 1
          fi
          if [ -z "$BRANCH_REF" ]; then
            echo "::error::branch-ref is '' — checkout would silently fall back to the triggering event's own ref instead of failing. Check the caller's expression (e.g. github.event.pull_request.head.ref is empty on events without a pull_request context)."
            exit 1
          fi
          if ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected-head-sha must be a full 40-character commit SHA, got '$EXPECTED_HEAD_SHA' — check the caller's expression (e.g. github.event.pull_request.head.sha is empty on events without a pull_request context)."
            exit 1
          fi
          if [ -z "$PR_NUMBER" ] && { [ -n "$COMMENT_MARKER" ] || [ -n "$DISPATCH_WORKFLOW" ]; }; then
            echo "::error::pr-number is '' but comment-marker or dispatch-workflow is set — both need a PR to act on. Pass pr-number, or clear comment-marker/dispatch-workflow to skip them."
            exit 1
          fi
          if [ -n "$PR_NUMBER" ] && ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr-number must be a positive integer, got '$PR_NUMBER'"
            exit 1
          fi
          # Written last, only once every check above has passed -- an
          # earlier write would need $GITHUB_OUTPUT bound in every test
          # (and every real run) that exercises any check below this line,
          # for a value that a failing run never needed in the first place.
          echo "use_push_token=$HAS_PUSH_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check out the branch
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch-ref }}
          # Full history, not just this ref: the caller may want commit_sha
          # compared against a base elsewhere, and a shallow clone here would
          # be a false economy on a job this cheap.
          fetch-depth: 0
          # Nothing in this job has executed anything from the pull request
          # — that's this whole workflow's reason to exist (see AGENTS.md) —
          # so there is no untrusted code in reach of a persisted credential
          # to begin with. False anyway: the commit/push step below
          # authenticates through an explicit token URL, never this
          # checkout's credential.
          persist-credentials: false

      - name: Refuse to act on an untested branch head
        id: guard
        env:
          # git's check-ref-format allows characters like ', $, ;, |, & and
          # backticks in a branch name, so a same-repo collaborator could
          # name their branch to inject shell code if this were expanded
          # directly into the script below. As env vars, both values reach
          # the shell as data.
          BRANCH_REF: ${{ inputs.branch-ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        run: |
          set -euo pipefail
          actual_head_sha=$(git rev-parse HEAD)
          echo "actual_head_sha=$actual_head_sha" >> "$GITHUB_OUTPUT"
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::warning::$BRANCH_REF advanced to $actual_head_sha since the artifact was rendered against $EXPECTED_HEAD_SHA — skipping; the run triggered by that push renders and commits against it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Empty the destination before extracting the artifact
        id: clear
        if: steps.guard.outputs.skip != 'true'
        env:
          DEST_PATH: ${{ inputs.dest-path }}
        # download-artifact EXTRACTS into dest-path, it doesn't replace it —
        # a file the new render dropped (an orphaned snapshot, say) would
        # otherwise sit there untouched, `git add -A` would see it as
        # unchanged, and the "artifact's contents replace dest-path"
        # contract in the artifact-name input's own description would be
        # false for exactly the case that matters (a deletion). Clearing
        # first makes the directory's final content always equal to
        # whatever the artifact actually contains, deletions included.
        #
        # dest-path is owner-configured (set in each caller's own workflow
        # YAML, never derived from PR content), but this rm -rf is validated
        # before running regardless: an absolute path, '.', or anything that
        # resolves outside the checkout — including via a '..' escape —
        # would delete far more than the intended generated-output
        # directory, up to and including the checkout's own .git. Cheap to
        # rule out, and a typo in a caller's `with:` block is a more
        # realistic way to hit this than anything adversarial.
        #
        # A leading '~' gets the same rejection for a sharper reason: this
        # step's own `realpath -m` never expands it (it's a plain
        # canonicalizer, not a shell), so "~/foo" validates here as the
        # literal, harmless subdirectory $GITHUB_WORKSPACE/~/foo — but the
        # LATER "Download the artifact" step hands the raw, unvalidated
        # dest-path string to actions/download-artifact's `path:` input,
        # whose own code (`if (inputs.path.startsWith('~')) inputs.path =
        # inputs.path.replace('~', os.homedir())` — confirmed against its
        # source before fixing) expands it to the runner's real home
        # directory. What gets validated and what actually receives the
        # artifact would silently be two different paths.
        #
        # Rejecting just "~" and "~/..." wasn't enough: startsWith('~') is
        # true for ANY leading tilde, slash or not, and `.replace('~', X)`
        # is a plain substring swap with no separator inserted — so
        # "~snapshots" becomes homedir+"snapshots" concatenated directly
        # (e.g. "/home/runnersnapshots"), a broken but still non-checkout
        # path that the earlier, narrower pattern let straight through.
        # Verified directly (both the shell match and the actual JS
        # replace) before widening this to reject any leading '~' at all.
        run: |
          set -euo pipefail
          case "$DEST_PATH" in
            ""|.|/|/*|"~"*) echo "::error::dest-path must be a non-empty path relative to the checkout root, not '$DEST_PATH'"; exit 1 ;;
          esac
          resolved=$(cd "$GITHUB_WORKSPACE" && realpath -m -- "$DEST_PATH")
          # dest-path's STRING is owner-configured, but whatever's actually
          # on disk at that path comes from the checkout of branch-ref — a
          # PR the caller is rendering — so a symlink there is PR-controlled
          # content. realpath -m follows symlinks in every existing leading
          # component, so a PR that replaces (say) "snapshots" with a
          # symlink to another real directory elsewhere in the checkout
          # (anywhere but .git, which is already blocked below) makes
          # $resolved silently point at that other directory instead — the
          # containment checks below pass, and this step deletes whatever
          # the symlink targets rather than the location the caller named.
          # Verified directly: a symlink at dest-path pointing at a sibling
          # directory gets its TARGET's contents deleted while the symlink
          # itself survives, dangling. Comparing against `realpath -sm`
          # (identical, but never follows a symlink) catches a symlink
          # anywhere in the path — direct or in an intermediate component —
          # without walking components by hand.
          literal=$(cd "$GITHUB_WORKSPACE" && realpath -sm -- "$DEST_PATH")
          if [ "$resolved" != "$literal" ]; then
            echo "::error::dest-path ($DEST_PATH) resolves through a symlink to $resolved — refusing to delete a symlinked location"
            exit 1
          fi
          case "$resolved" in
            "$GITHUB_WORKSPACE")
              echo "::error::dest-path resolves to the checkout root ($resolved) — refusing to delete it"; exit 1 ;;
            # Any '.git' path COMPONENT, not just at the checkout root: git
            # itself refuses to track anything under a directory literally
            # named .git anywhere in the path, even with `git add -f`, and
            # does so with exit 0 and nothing staged — no error, just
            # silence. Verified directly: `git add -f -A --
            # fixtures/repo/.git` after populating that directory stages
            # nothing at all. A dest-path like "fixtures/repo/.git" would
            # pass the old root-only check, get emptied and re-downloaded
            # into here just fine, and then the "Commit and push" step's
            # `git add -f -A` would silently stage none of it — the run
            # reports committed=false as if there was nothing to commit,
            # when really the artifact landed on disk and just never made
            # it into git. `*` in a case pattern matches across `/`, so a
            # single `*/.git` alternative catches .git at any depth, not
            # just one level down (verified against a: b: c: .git and
            # deeper).
            "$GITHUB_WORKSPACE"/.git|"$GITHUB_WORKSPACE"/.git/*|"$GITHUB_WORKSPACE"/*/.git|"$GITHUB_WORKSPACE"/*/.git/*)
              echo "::error::dest-path resolves through a .git directory ($resolved) — git would silently refuse to track anything under it, even with -f"; exit 1 ;;
            "$GITHUB_WORKSPACE"/*)
              : ;;
            *)
              echo "::error::dest-path resolves outside the checkout: $resolved"; exit 1 ;;
          esac
          # $resolved, not the raw $DEST_PATH: realpath -m collapses '..'
          # lexically, but rm resolves a path by actually traversing each
          # component — a dest-path like "missing/../snapshots", where
          # "missing" doesn't exist, validates fine (it resolves to
          # .../snapshots, safely inside the checkout) but then silently
          # deletes NOTHING when passed to rm literally: -f suppresses the
          # "no such file or directory" from the failed traversal into the
          # nonexistent "missing" component. Verified directly. $resolved
          # is already the exact, already-validated absolute path with no
          # residual '..' to mis-traverse.
          rm -rf -- "$resolved"

      - name: Download the artifact
        id: download
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.dest-path }}
        # Fails the job LOUDLY, on purpose — no continue-on-error. A missing
        # artifact and a genuinely empty render are indistinguishable from
        # here (actions/upload-artifact cannot represent "zero files" as a
        # real artifact at all, so a caller whose render can legitimately
        # produce nothing must still upload a placeholder for that case), but
        # guessing wrong in either direction is worse than asking: treating a
        # missing artifact as "nothing to do" would silently drop a real
        # deletion (dest-path was already emptied above, so the loss would be
        # invisible until someone noticed stale content never went away);
        # treating it as fatal at least says so, on the exact run where it
        # happened, with GitHub's own "artifact not found" error attached.

      - name: Commit and push
        id: commit
        if: steps.guard.outputs.skip != 'true' && steps.download.outcome == 'success'
        env:
          # push-token when the caller supplied one, so the push authenticates
          # as a real user (retriggers pull_request/pull_request_target
          # naturally) instead of GITHUB_TOKEN (retriggers nothing). validate
          # already refused the one combination where falling back to
          # GITHUB_TOKEN here would be unsafe (pull_request_target +
          # dispatch-workflow + no push-token) — this fallback covers only
          # the safe remaining cases: pull_request_target with no
          # dispatch-workflow at all (caller retriggers some other way), or
          # plain pull_request (dispatch-workflow, if set, is safe there).
          GH_TOKEN: ${{ secrets.push-token || github.token }}
          # Same reasoning as the guard step: none of these are safe to
          # splice directly into the script.
          BRANCH_REF: ${{ inputs.branch-ref }}
          DEST_PATH: ${{ inputs.dest-path }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
          # `--` before a pathspec only tells git "no more options follow" —
          # it does NOT make the pathspec's own text literal. A dest-path a
          # caller literally names with git's pathspec magic syntax (e.g.
          # ":(exclude)**") is still parsed as magic even past `--`,
          # verified with a real repo: `git add -f -A -- ':(exclude)**'`
          # exits 0 and stages nothing (":(exclude)**" excludes everything,
          # with nothing else to exclude FROM), and the quiet `git diff
          # --cached --quiet` check just below then reports "No changes" —
          # exactly the silently-uncommitted-artifact failure this step's
          # own `-f` comment already guards a different version of.
          # GIT_LITERAL_PATHSPECS=1 is git's own documented escape hatch:
          # every pathspec for the rest of this step is treated as a plain
          # string, verified to turn the same repro into a real staged file.
          GIT_LITERAL_PATHSPECS: "1"
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The dest-path validation earlier rejects a .git path COMPONENT
          # in dest-path itself, but has no way to see what's inside the
          # artifact the download step just extracted — a render that
          # happens to produce a nested .git file or directory (a fixture
          # repo, say) lands here undetected. `git add -f` doesn't fail on
          # a .git entry, it silently SKIPS it while still staging
          # everything else: verified directly, `git add -f -A --
          # out/example` with out/example/.git/config and
          # out/example/real.txt present stages only real.txt, exit 0,
          # nothing said about the dropped one. That's a successful-looking
          # commit that's silently missing part of the artifact — worse
          # than the "nothing staged at all" case dest-path's own .git
          # check guards, since there's no empty-diff signal to catch it.
          # `find -name .git` matches the exact basename at any depth, so
          # this catches both a `.git` directory and a stray `.git` file.
          #
          # $GITHUB_WORKSPACE/$DEST_PATH, not the bare $DEST_PATH: find's
          # own argument syntax is `find [path...] [expression]`, and it
          # decides "path" vs "expression" by whether an argument starts
          # with '-' — with NO `--` escape hatch the way most GNU tools
          # have one. A dest-path like "-delete" (already validated as a
          # safe relative path by the checks above — nothing here rejects
          # a leading '-') would make find read it as the primary `-delete`
          # instead of a path, defaulting the search root to '.' (this
          # step's cwd, the checkout root) and deleting every file found
          # there. Verified directly against a real filesystem: bare
          # `find "-delete" -name .git` recursively deleted an entire
          # populated directory tree. Prefixing with $GITHUB_WORKSPACE
          # guarantees the argument always starts with '/', which find can
          # never parse as an expression — confirmed the same repro then
          # errors cleanly ("No such file or directory") instead.
          #
          # realpath -m on top of that, not just the raw concatenation: a
          # dest-path like "missing/../snapshots" (an accepted shape — it
          # already resolves inside the checkout, same as the "Empty the
          # destination" step's own already-handled case) needs "missing"
          # to actually exist as a real, traversable directory for `find`
          # to walk into it and back out via '..' — but it never does.
          # git add and actions/download-artifact both handle this shape
          # fine, because both resolve '..' lexically before ever touching
          # the filesystem (verified against download-artifact's own
          # source: it calls `path.resolve(inputs.path)` before creating
          # anything, so "missing" is never created; and `git add -f -A --
          # "missing/../snapshots"` stages correctly with no such
          # directory needed) — but a literal `find` walk isn't lexical,
          # it's a real directory traversal, so it fails closed with
          # "No such file or directory" and set -e aborts an otherwise
          # completely valid commit. realpath -m collapses '..' the same
          # lexical way `path.resolve` and git's pathspec matching do,
          # without needing "missing" to exist — verified directly with
          # this exact shape before adding it here.
          resolved_dest=$(realpath -m -- "$GITHUB_WORKSPACE/$DEST_PATH")
          git_entries=$(find "$resolved_dest" -name .git)
          if [ -n "$git_entries" ]; then
            echo "::error::the artifact contains .git entries under $DEST_PATH, which git add -f silently skips rather than staging or erroring on:"
            echo "$git_entries" | sed 's/^/::error::  /'
            exit 1
          fi
          # A previously-committed submodule at dest-path leaves a mode-160000
          # "gitlink" index entry (a recorded commit SHA, no blob) that the
          # rm -rf + re-extract + `git add -f -A` sequence below does NOT
          # update or replace: verified directly — after rm -rf and writing a
          # real file back in its place, `git add -f -A -- "$DEST_PATH"`
          # exits 0, `git ls-files -s` still shows the untouched 160000
          # entry, the real file is never staged, and `git diff --cached
          # --quiet` / `git status --short` report no changes at all. Under
          # this workflow's contract dest-path holds nothing but generated
          # artifact content, wiped and replaced every run, so a gitlink
          # there is always stale, never a legitimate configuration to defer
          # to silently.
          gitlink_entries=$(git ls-files -s -- "$DEST_PATH" | awk '$1 == "160000"')
          if [ -n "$gitlink_entries" ]; then
            echo "::error::the index has a stale submodule (gitlink) entry under $DEST_PATH that rm -rf + git add -f does not update or replace:"
            echo "$gitlink_entries" | sed 's/^/::error::  /'
            exit 1
          fi
          # -f (force): dest-path was rm -rf'd and freshly re-extracted from
          # the artifact above, so everything under it right now IS the
          # artifact's own content — not a mix where a caller's .gitignore
          # (say, a blanket *.png rule) might be deliberately excluding part
          # of it. Without -f, `git add -A` silently skips a new file that
          # matches .gitignore — verified: an untracked, gitignored file
          # under dest-path is left out of the index entirely, so the commit
          # below would succeed while quietly omitting real artifact content,
          # with nothing anywhere saying so.
          git add -f -A -- "$DEST_PATH"
          if git diff --cached --quiet; then
            echo "No changes under $DEST_PATH."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "$COMMIT_MESSAGE"
          # Explicit URL, not the `origin` remote name: this checkout never
          # ran anything untrusted (see the checkout step above), so there's
          # nothing to defend `origin.url` against here — this is just the
          # simplest way to authenticate a push without persisting a
          # credential in .git/config for the rest of the job to carry.
          #
          # --force-with-lease pinned to the exact SHA the guard step already
          # verified branch-ref was at: a plain push is a no-op safety check
          # against a moved branch (any fast-forward succeeds, including one
          # from a branch that was deleted and recreated, or force-reset
          # backward, between the guard running and this step reaching the
          # push — the new commit's parent is still an ancestor either way,
          # so it would silently resurrect or undo whatever the intervening
          # change was doing). The lease makes the push fail instead of
          # guessing whenever the remote ref isn't still exactly what the
          # guard saw.
          git push --force-with-lease="$BRANCH_REF:$EXPECTED_HEAD_SHA" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH_REF"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI on the new commit
        # Only when the push used GITHUB_TOKEN: a push-token push already
        # authenticated as a real user, which retriggers the caller's own
        # pull_request/pull_request_target trigger on its own -- dispatching
        # again on top of that would start a second, redundant run of the
        # same workflow for the same commit.
        if: >-
          steps.commit.outputs.committed == 'true' && inputs.dispatch-workflow != ''
          && steps.validate.outputs.use_push_token != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_REF: ${{ inputs.branch-ref }}
          DISPATCH_WORKFLOW: ${{ inputs.dispatch-workflow }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          if ! gh workflow run "$DISPATCH_WORKFLOW" --ref "$BRANCH_REF" -f pr="$PR_NUMBER"; then
            echo "::error::Pushed to $BRANCH_REF but could not dispatch $DISPATCH_WORKFLOW on it (does it have workflow_dispatch with a pr input, on the default branch?). Dispatch it by hand from the Actions tab."
            exit 1
          fi

      - name: Note that push-token already retriggered CI
        if: >-
          steps.commit.outputs.committed == 'true' && inputs.dispatch-workflow != ''
          && steps.validate.outputs.use_push_token == 'true'
        run: echo "::notice::push-token was supplied; skipping dispatch-workflow since the authenticated push already retriggers CI on its own."

      - name: Comment freshness on the PR
        if: always() && inputs.comment-marker != '' && inputs.pr-number != ''
        # A GitHub API hiccup posting a convenience comment must not turn an
        # otherwise-successful commit/push red. The catch below still warns,
        # so a missing comment always has a reason in the log.
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          ARTIFACT_NOUN: ${{ inputs.artifact-noun }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          CLEAR_OUTCOME: ${{ steps.clear.outcome }}
          SKIPPED: ${{ steps.guard.outputs.skip }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          HEAD_SHA: ${{ steps.commit.outputs.commit_sha || steps.guard.outputs.actual_head_sha }}
          # A WORKFLOW INPUT, not a step output — unlike HEAD_SHA (unset
          # when guard never completed), this is always present regardless
          # of which step failed, so it's the only reliable "what state was
          # THIS run even about" signal available to the early-failure
          # branch below.
          EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        with:
          script: |
            const marker = process.env.COMMENT_MARKER;
            const noun = process.env.ARTIFACT_NOUN;
            const prNumber = Number(process.env.PR_NUMBER);

            let status;
            // The SHA this run's report is actually about — HEAD_SHA by
            // default, overridden to EXPECTED_HEAD_SHA in the early-failure
            // branch below, where HEAD_SHA is often empty. Declared here,
            // not const, specifically so that branch can redirect it.
            let referenceHeadSha = process.env.HEAD_SHA;
            // Set only in the "guard confirmed the branch was genuinely at
            // expected-head-sha" branch below — the one branch where a
            // live-head re-check right before writing is both meaningful
            // (HEAD_SHA is a reliable stand-in for what this run's report is
            // about) and necessary (an early-failure or SKIPPED report must
            // post unconditionally, or reintroduce the bugs those two fixes
            // just closed).
            let needsLiveHeadCheck = false;
            // checkout/guard/clear all run unconditionally (or nearly so —
            // guard has no if: at all, clear only requires guard to have
            // already succeeded with skip!='true'), so a non-success outcome
            // from any of them means the job failed BEFORE the download step
            // ever got a chance to run — distinct from download itself
            // failing or finding nothing, which a later branch reports.
            // Handled FIRST — but NOT unconditionally: an older overlapping
            // run can hit a transient checkout/guard/clear failure AFTER a
            // newer run (triggered by a later push) has already posted its
            // own accurate report, and posting here unconditionally would
            // overwrite that accurate, current report with a stale warning
            // about a head the PR has moved past. HEAD_SHA is unreliable for
            // the usual live-head check here (guard may not have even run,
            // so it can be empty) — EXPECTED_HEAD_SHA stands in instead: a
            // WORKFLOW INPUT this run received regardless of what failed, so
            // it's always available, and it names exactly the head this
            // failed run was trying to act on. If the PR's live head still
            // matches it, nothing has moved and this failure is exactly what
            // the PR's current state needs reported; if not, a newer run
            // already owns the report.
            if (process.env.CHECKOUT_OUTCOME !== 'success' || process.env.GUARD_OUTCOME !== 'success' || process.env.CLEAR_OUTCOME === 'failure') {
              needsLiveHeadCheck = true;
              referenceHeadSha = process.env.EXPECTED_HEAD_SHA;
              status = `⚠️ An earlier step failed before the artifact could be checked — see the run log.`;
            } else if (process.env.SKIPPED === 'true') {
              // A skipped run observed the branch already past
              // expected-head-sha before it did anything — the run that
              // pushed the newer head is responsible for reporting on it,
              // not this one. Posting anything here risks overwriting that
              // other run's already-accurate report: HEAD_SHA falls back to
              // guard's own actual_head_sha in this case, which is exactly
              // what a legitimate "up-to-date" run for that SAME head also
              // reports as its own HEAD_SHA once nothing changes after it
              // runs — so a live-head comparison can't tell a skipped run's
              // stale deferral apart from a genuine, current report for the
              // same head (both compare equal to the live head whenever
              // nothing has moved since). Skipping unconditionally, instead
              // of trying to resolve that ambiguity with a comparison, is
              // what actually closes it — the message already promised "the
              // run that pushed it will report", so this run has nothing
              // left to say.
              core.info(`Branch advanced before this run's guard step — the run that pushed the newer head reports, not this one. Skipping the freshness comment.`);
              return;
            } else {
              // Guard confirmed the branch was still at expected-head-sha
              // when THIS run checked it, so HEAD_SHA (this run's own new
              // commit if it made one, else that confirmed head) is now a
              // reliable stand-in for "what this run's report is about" —
              // worth re-checking against the PR's LIVE head right before
              // writing (done below, as late as possible — see the comment
              // there for why not here). Overlapping runs are expected
              // (cancel-in-progress is asynchronous), so an older run can
              // still reach this step after a newer run, triggered by a
              // later push, already posted its own accurate status;
              // without a check like this, whichever comment write
              // finishes LAST wins even when reporting on a push that's no
              // longer the PR's head, and nothing ever corrects a stale
              // status left behind that way.
              needsLiveHeadCheck = true;

              if (process.env.DOWNLOAD_OUTCOME !== 'success') {
                // Ambiguous by construction (see the download step's own
                // comment): either the artifact never existed this run, or
                // the download itself failed transiently. Say so rather
                // than guessing either "regenerated" or "up-to-date".
                status = `⚠️ Could not verify — the \`${process.env.ARTIFACT_NAME}\` artifact wasn't available this run.`;
              } else if (process.env.COMMIT_OUTCOME !== 'success') {
                // The download succeeded, so the commit step DID run (its
                // own if: requires exactly that) — a non-success outcome
                // here means it ran and failed (e.g. a rejected push from a
                // race), not "nothing to commit". COMMITTED is unset either
                // way, so without this check a real failure would
                // misreport as the clean up-to-date case below.
                status = `⚠️ The commit step failed after a successful download — check the run log.`;
              } else if (process.env.COMMITTED === 'true') {
                status = `🔄 Regenerated ${noun}s this run.`;
              } else {
                status = `✅ ${noun}s up-to-date — no changes from this push.`;
              }
            }
            const body = `${marker}\n**Status:** ${status}\n\nHead: \`${(referenceHeadSha || '').slice(0, 7)}\``;
            // The lookup can't fail open the way the update/create below
            // can: its result picks update-vs-create, so an error swallowed
            // into "not found" doesn't lose the comment, it posts a
            // *duplicate*, and every later run duplicates again. `paginate`
            // for the same reason — past 100 comments the marker falls off
            // page one and reads as a genuine no-match.
            let comments;
            try {
              comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: prNumber,
                per_page: 100,
              });
            } catch (e) {
              core.warning(`Could not list PR comments (${e.message}); skipping the freshness comment rather than risking a duplicate.`);
              return;
            }
            // Anchored to the exact start of the body, not a bare substring
            // search (Codex review): the body is always constructed as
            // `${marker}\n...` just above, so a marker appearing anywhere
            // else in an unrelated bot comment -- another automation's own
            // output, or a different comment-marker that happens to contain
            // this one as a substring -- can no longer be mistaken for this
            // workflow's own sticky comment and have its content overwritten.
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.startsWith(`${marker}\n`));

            // Re-checked here — as the LAST thing before writing, after
            // listComments has already resolved — rather than once up top
            // before any of the above. The GitHub REST API has no
            // conditional-write primitive for issue comments (no ETag/If-
            // Match support to reject a write racing a concurrent one), so
            // full atomicity with the write itself isn't available; doing
            // the check first and the write last is the closest approximation
            // — it closes the largest realistic contributor to the gap (the
            // listComments await, which can be several paginated round
            // trips), leaving only the width of the write call itself,
            // which no amount of client-side reordering can close further.
            if (needsLiveHeadCheck) {
              try {
                const pr = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
                if (pr.data.head.sha !== referenceHeadSha) {
                  core.info(`PR head is now ${pr.data.head.sha}, not this run's ${referenceHeadSha} — a newer run supersedes this report. Skipping the freshness comment.`);
                  return;
                }
              } catch (e) {
                core.warning(`Could not confirm the PR's current head (${e.message}); skipping the freshness comment rather than risking overwriting a newer, accurate one.`);
                return;
              }
            }

            try {
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body });
              }
            } catch (e) {
              core.warning(`Could not post the freshness comment (${e.message}); the artifact is committed to the branch regardless.`);
            }
