name: ci

# Consumers reference the reusable workflow at `@main` -- no tag, no SHA,
# deliberately, since bumping a pin in every repository is the cost
# centralizing was meant to remove. So this suite runs on the pull request,
# which is the only gate between a change and every consumer's next run:
# there is no release step afterwards to catch anything. The `push` run
# below re-checks the commit the merge produced.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `lanes` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the gate on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]

# Nothing here writes to the repository. The docs lane's classify and lanes
# jobs read the PR's files and commits through the workflow token;
# read-only, and still nothing here can write.
permissions:
  contents: read
  pull-requests: read

# simmo's shape (mikelward/simmo ci.yml, which says why each half is so). A
# pull request shares one group and cancels the run in progress when a newer
# event on it starts one: a push makes it stale, and the body or title edit
# `edited` reports beside each push duplicates it. Without it every push ran
# twice, and the older run's checks failed on the head moving. A push to
# main, or a dispatch aimed at it, gets a group of its own keyed by commit, so
# no main run is canceled or evicted from the one pending slot a group holds.
# Keyed on the event, not the ref, so a move to `pull_request_target` can't
# collapse every pull request into one group.
#
# An `edited` run never cancels: it carries the head as of the edit, and the
# body edit lands just before its push, so GitHub starting it after the push's
# run (it doesn't promise the order) would cancel the only run on the new head.
# It queues behind the run in progress instead, and a later push's run
# replaces it while it waits.
concurrency:
  group: ci-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && format('main-{0}', github.sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && github.event.action != 'edited' }}

jobs:
  # Decides whether the test job may skip: true only when every changed
  # file in the PR is housekeeping (markdown — see .github/lanes.conf for
  # the rule; the engine is mikelward/lanes). Pushes to main are always
  # classified as code.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Pinned rather than whatever node the runner image carries:
      # lanes-policy.test.js matches globs with the same standard primitive
      # the lanes engine uses, and an image downgrade must not silently
      # change which primitives exist.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # The structural tests parse YAML with mikelward/yaml-lite, which
      # tracks @main instead of living here as a vendored copy that needs
      # syncing. The suite fails loudly if this checkout goes missing — a
      # skip would be a silent false pass. Locally a sibling clone serves
      # the same role; see resolve-yaml-lite.js.
      - uses: actions/checkout@v5
        with:
          repository: mikelward/yaml-lite
          path: .yaml-lite
          persist-credentials: false
      - run: node --test *.test.js

  # The one check the main ruleset should require (alongside `codex`).
  # Always runs, always reports — green only when the test job succeeded,
  # or when it was skipped and the skip is INDEPENDENTLY verified as
  # justified: the gate re-derives the classification itself rather than
  # trusting classify's output. Any other combination is an explicit red,
  # never a silent pass. Named `lanes` from the start — this repo adopts
  # the engine after mikelward/lanes#9's check rename, so it never carries
  # the `gate` name its siblings are still migrating away from.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run, and harmless on a pull_request
          # one, which takes the same commit from its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
