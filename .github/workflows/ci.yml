name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The structural tests parse YAML with mikelward/yaml-lite, which
      # tracks @main instead of living here as a vendored copy that needs
      # syncing. The suite fails loudly if this checkout goes missing — a
      # skip would be a silent false pass. Locally a sibling clone serves
      # the same role; see resolve-yaml-lite.js.
      - uses: actions/checkout@v5
        with:
          repository: mikelward/yaml-lite
          path: .yaml-lite
          persist-credentials: false
      - run: node --test *.test.js
